# See https://pre-commit.com for more information
repos:
  - repo: local
    hooks:
      - id: credential-check
        name: AWS Auth Credential & Secret Scanner
        entry: python3 scripts/check_credentials.py --staged
        language: system
        stages: [commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
