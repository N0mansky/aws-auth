name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-binaries:
    name: Build Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aws-auth-linux-amd64
            binary_path: dist/aws-auth
          - os: macos-latest
            artifact_name: aws-auth-macos-universal
            binary_path: dist/aws-auth
          - os: windows-latest
            artifact_name: aws-auth-windows-amd64.exe
            binary_path: dist/aws-auth.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller aws-auth.spec

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir -p release_assets
          cp ${{ matrix.binary_path }} release_assets/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/${{ matrix.artifact_name }}

  publish-release:
    name: Scan Artifacts & Publish Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Prepare release assets directory
        run: |
          mkdir -p dist_release
          find release_assets -type f -exec cp {} dist_release/ \;
          ls -la dist_release/

      - name: Run Trivy vulnerability scan on release artifacts
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'dist_release'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Generate SHA-256 Checksums
        working-directory: dist_release
        run: |
          sha256sum aws-auth-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist_release/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_release/*
          generate_release_notes: true
          draft: false
          prerelease: false
