[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-auth"
version = "1.0.1"
description = "Fast, modular AWS SSO authentication tool with MCP server support, credential caching, and EC2/EKS integration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "N0mansky" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.26.0",
    "requests>=2.31.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/N0mansky/aws-auth"
Documentation = "https://github.com/N0mansky/aws-auth#readme"
Repository = "https://github.com/N0mansky/aws-auth.git"
Issues = "https://github.com/N0mansky/aws-auth/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=5.13.0",
]

[project.scripts]
aws-auth = "aws_auth.cli:main"
aws-auth-mcp = "aws_auth.mcp_server:main"

[tool.setuptools.packages.find]
include = ["aws_auth*"]
